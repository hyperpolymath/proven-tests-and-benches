# SPDX-License-Identifier: MPL-2.0
# Pre-commit hooks for hyperpolymath RSR repos.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # --- Standard hooks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # LICENSE carries a trailing space on line 38 of the verbatim MPL-2.0
        # text; licence text must never be auto-rewritten (AGENTS.md:15, DEBT L-2).
        exclude: '^LICENSE$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # --- A2ML manifest validation ---
  - repo: https://github.com/hyperpolymath/a2ml-pre-commit
    # Pinned (was `rev: main`, a mutable ref contradicting the repo's own
    # 40-char-SHA discipline — DEBT T-5).
    rev: f27ac5e5aeede65875c85c2f5a27aa0ab88df0d5
    hooks:
      - id: validate-a2ml
        name: Validate A2ML manifests

  # --- K9 contract validation ---
  # validate-k9 REMOVED (DEBT T-3): no contractile files (Mustfile, Trustfile,
  # K9, ADJUST) exist in this repository, so the hook never saw real input — a
  # gate that cannot fail is the shape AGENTS.md:13 warns about. Restore it in
  # the same commit that adds the first contractile artefact.
