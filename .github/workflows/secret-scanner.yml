# This workflow is managed by gh actions-lock.
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# No `secrets:` block, deliberately: secret-scanner-reusable.yml @75bd5994
# declares no caller secrets and reads no `secrets.*` context (it runs a
# pinned gitleaks binary under the job's own `github.token`), so the former
# `secrets: inherit` only forwarded every repository secret to a workflow that
# never asked for one (WH008).
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    permissions:
      actions: read
      contents: read
      security-events: write
