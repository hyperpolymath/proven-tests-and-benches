# This workflow is managed by gh actions-lock.
#
# Mirror on push (Immaculate Guide Edict 8) via the estate reusable. The
# reusable self-gates on secret presence: with no GITLAB_SSH_KEY configured it
# prints an explicit "Skipped" step rather than failing — a loud skip, not a
# fake pass.
name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    uses: metadatastician/standards/.github/workflows/mirror-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    # Explicit secrets map, not `secrets: inherit`: the callee
    # (standards@75bd599) declares exactly these seven forge keys, all optional.
    secrets:
      GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
      BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
      CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
      SOURCEHUT_SSH_KEY: ${{ secrets.SOURCEHUT_SSH_KEY }}
      DISROOT_SSH_KEY: ${{ secrets.DISROOT_SSH_KEY }}
      GITEA_SSH_KEY: ${{ secrets.GITEA_SSH_KEY }}
      RADICLE_KEY: ${{ secrets.RADICLE_KEY }}
    permissions:
      actions: read
      contents: read
      security-events: write
