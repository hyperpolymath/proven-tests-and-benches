# This workflow is managed by gh actions-lock.
#
# Mirror on push (Immaculate Guide Edict 8) via the estate reusable. The
# reusable self-gates on secret presence: with no GITLAB_SSH_KEY configured it
# prints an explicit "Skipped" step rather than failing — a loud skip, not a
# fake pass.
name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@f2f8e6791b09f1f498f01b798e4670a1ebc9c986
    secrets: inherit
