# This workflow is managed by gh actions-lock.
#
# Mirror on push (Immaculate Guide Edict 8) via the estate reusable. The
# reusable self-gates on secret presence: with no GITLAB_SSH_KEY configured it
# prints an explicit "Skipped" step rather than failing — a loud skip, not a
# fake pass.
name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@5b1d00229e5e8c0c0fbfedc7e80f37ea50f49236
    secrets: inherit
