# This workflow is managed by gh actions-lock.
#
# Mirror on push (Immaculate Guide Edict 8) via the estate reusable. The
# reusable self-gates on secret presence: with no GITLAB_SSH_KEY configured it
# prints an explicit "Skipped" step rather than failing — a loud skip, not a
# fake pass.
name: Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@1ded685afb366dededa9f372f82fb58cd45f3c7b
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write
