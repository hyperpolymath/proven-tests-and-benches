# This workflow is managed by gh actions-lock.
#
# Estate governance: the 11-job reusable gate from hyperpolymath/standards
# (workflow staleness, allowlist preflight, hypatia-baseline validation,
# language policy, Guix packaging policy, security policy, quality+docs,
# well-known, workflow lint, trusted-base, licence consistency).
#
# Adopted 2026-08-10: this was the single biggest estate-CI gap here — the
# canonical test-source repo was not itself governed (ultraplan Phase 2).
name: Governance

on:
  push:
    branches: [main, master]
  # No branches: filter — a required check whose workflow is branch-gated
  # never reports on PRs targeting other bases (the deadlock trap).
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: hyperpolymath/standards/.github/workflows/governance-reusable.yml@bd0df9ead7faf0cdfe0e13e7966d91e28d0101d4
