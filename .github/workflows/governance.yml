# This workflow is managed by gh actions-lock.
#
# Estate governance: the 11-job reusable gate from hyperpolymath/standards
# (workflow staleness, allowlist preflight, hypatia-baseline validation,
# language policy, Guix packaging policy, security policy, quality+docs,
# well-known, workflow lint, trusted-base, licence consistency).
#
# Adopted 2026-08-10: this was the single biggest estate-CI gap here — the
# canonical test-source repo was not itself governed (ultraplan Phase 2).
name: Governance

on:
  push:
    branches: [main, master]
  # No branches: filter — a required check whose workflow is branch-gated
  # never reports on PRs targeting other bases (the deadlock trap).
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  governance:
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    # Hypatia scanner commit. The pinned standards default (51ab649) predates
    # actions-lock v0.0.3 support and rejects this repo's lock; adb2f41 accepts
    # v0.0.2 and v0.0.3. Drop this override when the standards pin moves to a
    # commit whose default hypatia-ref is adb2f41 or later.
    with:
      hypatia-ref: adb2f41db34156cf81b2508f6596a10c7f076098
    permissions:
      actions: read
      contents: read
      security-events: write
