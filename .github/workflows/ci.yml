#
# The Idris2 gate for this repository.
#
# WHY THIS CHANGED (2026-08-03)
# -----------------------------
# This workflow was `workflow_dispatch:`-only, on the stated rationale that the
# GitLab `idris2` job was "the real gate" and GitHub should therefore consume
# zero Actions minutes. Two things were wrong with that:
#
#   1. There is no GitLab remote. `git remote -v` lists exactly one remote,
#      github.com/hyperpolymath/proven-tests-and-benches. `.gitlab-ci.yml`
#      describes a pipeline with no project to run on, so the "real gate" did
#      not exist.
#
#   2. Nothing else compiled the code either. `gh run list` shows this
#      workflow has NEVER run. The only workflow executing on push was CodeQL,
#      which fails every time (code scanning is not enabled on this private
#      repository) — so the repository was spending billed minutes on a job
#      that cannot succeed, while never running the one that matters.
#
# The zero-minute intent is honoured where it is cheap to do so: the three
# cheapest gates run before the toolchain is provisioned, the toolchain is
# cached across runs, and superseded runs are cancelled rather than left to
# finish.
#
# This repository is the estate's canonical source of test definitions
# (standards/testing-and-benchmarking/TESTING-TAXONOMY.adoc directs other repos
# to copy tests from here first), so an ungated regression here propagates.

name: CI (Idris2)

on:
  push:
    branches: [main]
  # No branches: filter on pull_request — a REQUIRED check whose workflow is
  # branch-filtered never reports on PRs targeting other bases, which blocks
  # them forever at "Expected - Waiting for status". (hypatia-scan.yml:8-11
  # documents this trap; this repo's CI became a required context on 2026-08-10.)
  pull_request:
  workflow_dispatch:

# Least privilege: this job reads the repository and nothing else.
permissions:
  contents: read

# Cancel superseded runs on the same ref. A second push while the first is
# still bootstrapping Idris2 would otherwise pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for CI. scripts/check-toolchain-pins.sh fails the
  # build if this disagrees with .tool-versions, the installer, .gitlab-ci.yml,
  # META.a2ml, STATE.a2ml or the README.
  IDRIS2_VERSION: 0.7.0

jobs:
  gate:
    name: Build, test and benchmark
    runs-on: ubuntu-latest
    # Generous because a cold cache bootstraps Idris2 from source; a warm cache
    # finishes in a fraction of this.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # --- Cheap gates first: these need no toolchain, so drift and escape
      # --- hatches fail in seconds rather than after a 15-minute bootstrap.

      - name: Check toolchain pins agree
        run: bash scripts/check-toolchain-pins.sh

      # One implementation, shared with `just lint`. This step used to carry its
      # own copy of the grep, and both copies covered only four of the six
      # patterns AGENTIC.a2ml bans — `idris_crash` and hole syntax were
      # prohibited by the manifest and caught by neither gate.
      - name: Check for proof escape hatches
        run: bash scripts/check-escape-hatches.sh

      # The anti-drift gate: every fact a document asserts (module counts,
      # package counts, lattice cells, taxonomy axes, the CRG grade+badge, the
      # DEBT register's own size) is COMPUTED from its source of truth and
      # compared against every restatement. One commit once falsified six
      # documents at a stroke and nothing noticed for four days; this step is
      # what notices. (Absorbs the previous inline badge check.)
      - name: Check documented facts against computed reality
        run: bash scripts/check-doc-facts.sh source

      # REUSE compliance was claimed in REUSE.toml and gated nowhere (DEBT L-4).
      # One tolerance, scoped and named: LICENSES/AGPL-3.0-or-later.txt is
      # deliberately unused pending an owner-only licensing decision (DEBT L-1,
      # REUSE.toml:27-37). Gating raw `reuse lint` would be permanently red on
      # that item — a gate whose red is routinely overridden is a false-positive
      # generator. Everything else (bad/missing licences, files without
      # copyright/licence info) fails hard.
      - name: REUSE compliance (tolerating only the documented L-1 item)
        run: |
          pipx install reuse >/dev/null 2>&1 || pip install --quiet reuse
          reuse lint --json > /tmp/reuse.json || true
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/reuse.json"))
          nc = d.get("non_compliant", {})
          problems = []
          for key, val in nc.items():
              if key == "unused_licenses":
                  extra = [u.get("license", u) if isinstance(u, dict) else u
                           for u in val]
                  extra = [e for e in extra if "AGPL-3.0-or-later" not in str(e)]
                  if extra:
                      problems.append(f"unused licences beyond the tolerated one: {extra}")
              elif val:
                  problems.append(f"{key}: {val}")
          if problems:
              print("REUSE non-compliance beyond the documented L-1 tolerance:")
              [print("  -", p) for p in problems]
              sys.exit(1)
          files = d.get("summary", {}).get("files_total") or d.get("files_count") or "?"
          print(f"OK: REUSE compliant across {files} files "
                "(sole tolerated issue: unused AGPL-3.0-or-later, DEBT L-1)")
          PY

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh

      # Workflows carry symbolic version refs (this account startup-refuses
      # bare-SHA uses:), so runtime immutability rests on this step: verify the
      # tags still resolve to the SHAs recorded in actions.lock. A re-pointed
      # tag fails here — the drift detection a raw tag ref lacks (PR #30).
      - name: Verify action refs against actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock 2>/dev/null || true
          if ! gh actions-lock --no-fix; then
            echo "::error::A workflow ref no longer matches the SHA recorded in actions.lock — possible re-pointed tag. Run gh actions-lock locally and review the diff."
            exit 1
          fi

      # --- Toolchain ---

      - name: Cache Idris2 toolchain
        id: cache-idris2
        uses: actions/cache@v6.1.0
        with:
          path: ~/.idris2
          key: idris2-v${{ env.IDRIS2_VERSION }}-${{ runner.os }}

      - name: Install Idris2
        run: bash scripts/install-idris2.sh
        env:
          IDRIS2_VERSION: v${{ env.IDRIS2_VERSION }}

      - name: Confirm the installed compiler matches the pin
        run: |
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
          "$HOME/.idris2/bin/idris2" --version
          bash scripts/check-toolchain-pins.sh

      # --- The actual gate ---

      - name: Build, test and benchmark
        run: bash scripts/ci-build.sh

      # Second doc-facts invocation: facts only a real run produces (suite pass
      # counts, coverage counts) checked against the report the run just wrote.
      - name: Check run-report facts against documented claims
        run: bash scripts/check-doc-facts.sh report build/report/proven-tests-report.json

      # Benchmark history: every run's JSON is retained as an artifact. The
      # Phase 3b baseline is computed as the mean of the last 10 main-run
      # medians (taxonomy L447), from these artifacts — never asserted.
      - name: Upload benchmark result artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: proven-bench-${{ github.run_id }}
          path: build/report/proven-bench.json
          retention-days: 90

      # --- Subject grading ---
      # scripts/ci-build.sh grades the external `proven` subject when a checkout
      # is reachable, and reports loudly on stderr when it is not — a skip there
      # is not a pass, and it is the evidence READINESS.adoc rests its grade on.
      #
      # CI has no sibling checkout by default, so the step below fetches one.
      # It is `continue-on-error` ONLY because the subject is an external
      # repository whose availability is not this repository's invariant; the
      # gate above has already run by this point and its result stands
      # regardless.
      - name: Fetch the `proven` subject for grading
        id: fetch-proven
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/hyperpolymath/proven.git "$RUNNER_TEMP/proven"

      - name: Grade the `proven` subject
        if: steps.fetch-proven.outcome == 'success'
        run: |
          export PATH="$HOME/.idris2/bin:$PATH"
          idris2 --build integrations/proven/proven-subject.ipkg
          cd integrations/proven
          PROVEN_ROOT="$RUNNER_TEMP/proven" ./build/exec/proven-subject-report

      - name: Note when subject grading did not run
        if: steps.fetch-proven.outcome != 'success'
        run: |
          echo "::warning::Subject grading DID NOT RUN — the 'proven' checkout could not be fetched."
          echo "The CRG evidence in READINESS.adoc rests on this step. A skip is not a pass."
