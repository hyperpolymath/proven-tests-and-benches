# This workflow is managed by gh actions-lock.
#
# OSSF Scorecard via the estate reusable. Weekly + manual — scorecard measures
# repo posture, not commit content, so per-push runs add noise not signal
# (cf. panic-attack #173 "make Scorecard periodic, not per-push").
name: OSSF Scorecard

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # The reusable uploads SARIF (security-events) and signs its results
  # (id-token); caller permissions CAP the called workflow, so granting
  # less here startup-fails the reusable. Workflow-level, not job-level:
  # a job-level block would REPLACE this map and drop the read scopes.
  security-events: write
  id-token: write

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@8750b94ac1bbe8c51ad13fe106669b13478f0b62
    secrets: inherit
