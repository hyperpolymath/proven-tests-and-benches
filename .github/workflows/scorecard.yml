# This workflow is managed by gh actions-lock.
#
# OSSF Scorecard via the estate reusable. Weekly + manual — scorecard measures
# repo posture, not commit content, so per-push runs add noise not signal
# (cf. panic-attack #173 "make Scorecard periodic, not per-push").
name: OSSF Scorecard

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@bd0df9ead7faf0cdfe0e13e7966d91e28d0101d4
    secrets: inherit
