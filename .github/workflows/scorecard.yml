# This workflow is managed by gh actions-lock.
#
# OSSF Scorecard via the estate reusable. Weekly + manual — scorecard measures
# repo posture, not commit content, so per-push runs add noise not signal
# (cf. panic-attack #173 "make Scorecard periodic, not per-push").
name: OSSF Scorecard

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write
jobs:
  scorecard:
    # Job-level permissions on the CALL (workflow_audit requires them explicit
    # here): the reusable's jobs further request security-events/id-token.
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@f2f8e6791b09f1f498f01b798e4670a1ebc9c986
    secrets: inherit
