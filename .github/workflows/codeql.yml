#
# CodeQL analysis — RE-ENABLED 2026-08-07.
#
# STATUS (2026-08-07)
# -------------------
# Unblock condition (a) below has been met: this repository is now PUBLIC, so
# code scanning is available without GitHub Advanced Security and the
# entitlement failure described below no longer applies. The push,
# pull_request and schedule triggers are restored.
#
# The CAUTION at the end of this header still stands: CodeQL *default setup*
# must NOT be switched on while this advanced workflow exists.
#
# The historical diagnosis is kept below because it is the evidence for why
# this file looked broken for a month, and because the same entitlement trap
# applies to every other private repository in the estate.
#
# HISTORICAL STATUS (measured 2026-08-03, while the repository was PRIVATE)
# ------------------------------------------------------------------------
# Every run of this workflow had failed. The cause was not the workflow:
#
#   "Code scanning is not enabled for this repository.
#    Please enable code scanning in the repository settings."
#
# This repository is PRIVATE, and code scanning on a private repository
# requires GitHub Advanced Security. Without it, CodeQL completes its analysis
# and then fails at the upload step, every time — runs 30725558250 (weekly
# cron, 2m59s), 30815363922 (pull request, 3m6s) and the 2026-07-28 push run
# all failed this way.
#
# Note that a previous fix here was necessary but not sufficient: the action
# was pinned to github/codeql-action@29b1f65c1f735799893313399435a59f54045865,
# a SHA that exists in NO repository (the GitHub API returns 422 for it, and
# the same phantom SHA was pinned across ~104 estate repositories). That is now
# corrected to a SHA that resolves — but a valid pin cannot fix an
# entitlement problem, so the runs still fail.
#
# WHY IT IS NO LONGER ON push/pull_request/schedule
# -------------------------------------------------
# Left on those triggers it burned billed Actions minutes on a guaranteed
# failure and kept main permanently red, which trains readers to ignore a red
# mark. It is retained rather than deleted because it becomes correct the
# moment either unblock condition below is met.
#
# TO RE-ENABLE — either is sufficient:
#   (a) Make the repository public. Code scanning is free for public repos.
#   (b) Enable GitHub Advanced Security on this private repository.
# Then restore the push/pull_request/schedule triggers below.
#
# CAUTION when re-enabling: do NOT also turn on CodeQL *default setup*.
# Default setup plus an advanced workflow like this one is a mode conflict —
# SARIF upload is rejected on every push and no SHA re-pin can fix it.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Newly published queries can find faults in code that has not changed, which
  # is the case a push-triggered scan never covers.
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
