# This workflow is managed by gh actions-lock.
#
# Hypatia estate scan. Immaculate Guide Edict 7: "A release that has not been
# scanned is not a release. It is a guess." Pinned to the NEWEST standards SHA
# (some estate consumers sit on a stale 81dbf2dd pin and are judged by a
# pre-lockfile ruleset — do not copy them).
name: Hypatia Security Scan

on:
  push:
    branches: [main, master]
  # No branches: filter — see governance.yml.
  pull_request:
  schedule:
    - cron: "40 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@f2f8e6791b09f1f498f01b798e4670a1ebc9c986
    secrets: inherit
