#
# Hypatia estate scan. Immaculate Guide Edict 7: "A release that has not been
# scanned is not a release. It is a guess." Pinned to the NEWEST standards SHA
# (some estate consumers sit on a stale 81dbf2dd pin and are judged by a
# pre-lockfile ruleset — do not copy them).
name: Hypatia Security Scan

on:
  push:
    branches: [main, master]
  # No branches: filter — see governance.yml.
  pull_request:
  schedule:
    # Re-touched 2026-10-06. GitHub runs a schedule as the actor who last changed
    # this cron line. It landed in #32, merged by gitar-bot[bot]; from 2026-08-17
    # every scheduled run (8/8) fired as that App and died at startup with
    # referenced_workflows: [] while push and PR runs of the same workflow were
    # green. Later edits (#81) never touched this line, so never re-attributed
    # it. The minute moved 40 -> 47 so the edit is a real schedule change.
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@71bb615e234133d22f04106c812aad9fcb269aa5
    secrets: inherit
