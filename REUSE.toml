SPDX-PackageName = "proven-tests-and-benches"
SPDX-PackageSupplier = "Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-PackageDownloadLocation = "https://github.com/hyperpolymath/proven-tests-and-benches"

# ---------------------------------------------------------------------------
# Why this file exists rather than 35 edited file headers
# ---------------------------------------------------------------------------
# `reuse lint` reported 9 files with neither copyright nor licence information
# and a further 26 missing copyright, leaving this repository non-compliant
# with REUSE 3.3.
#
# The obvious remedy — sweeping SPDX headers into every file — is explicitly
# forbidden by estate policy: "NEVER sweep SPDX headers in bulk. Every prior
# LLM sweep has scrambled identifiers, mis-licensed third-party code, or
# reverted owner decisions." REUSE.toml is the sanctioned alternative: it
# declares licensing for paths WITHOUT modifying the files themselves, so no
# existing header is touched and nothing can be silently relicensed.
#
# Licensing follows the estate's two-way split for a sole-owner repository:
#   code, config, CI, manifests -> MPL-2.0
#   prose and documentation     -> CC-BY-SA-4.0
#
# ---------------------------------------------------------------------------
# OUTSTANDING — needs an owner decision, deliberately NOT actioned here
# ---------------------------------------------------------------------------
# LICENSES/AGPL-3.0-or-later.txt is an UNUSED licence: no file in this
# repository declares AGPL, and CHANGELOG.md records that stray AGPL
# identifiers were removed — but the licence text itself was left behind.
# `reuse lint` will continue to report "Unused licenses: AGPL-3.0-or-later"
# until it is removed.
#
# It has NOT been deleted here. Removing a file from LICENSES/ is a licensing
# action, and estate policy reserves those to the owner. AGPL-3.0-or-later is
# the estate's licence for repositories co-maintained with the owner's son; if
# that was ever the intent for this repository, deleting the text would be the
# wrong call. Flagging instead of guessing.

# --- Build manifests and package definitions (code) ------------------------
# Globbed rather than listed by name: PR #20 added a fifth manifest
# (proven-spec-suite.ipkg) the same day this file was written, and an
# enumeration silently stops covering new ones. `reuse lint` went 108/108 ->
# 124/125 as a result. A glob cannot drift that way.
[[annotations]]
path = "**/*.ipkg"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- Repository configuration (code) ---------------------------------------
[[annotations]]
path = [
  ".editorconfig",
  ".gitignore",
  ".gitattributes",
  ".tool-versions",
  ".pre-commit-config.yaml",
  ".gitlab-ci.yml",
  "guix.scm",
  "Justfile",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- GitHub/CI configuration (code) ----------------------------------------
[[annotations]]
path = [
  ".github/**",
  "scripts/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- Machine-readable metadata (code: consumed by tools, not prose) --------
