version = 1
SPDX-PackageName = "proven-tests-and-benches"
SPDX-PackageSupplier = "Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-PackageDownloadLocation = "https://github.com/hyperpolymath/proven-tests-and-benches"

# ---------------------------------------------------------------------------
# Why this file exists rather than 35 edited file headers
# ---------------------------------------------------------------------------
# `reuse lint` reported 9 files with neither copyright nor licence information
# and a further 26 missing copyright, leaving this repository non-compliant
# with REUSE 3.3.
#
# The obvious remedy — sweeping SPDX headers into every file — is explicitly
# forbidden by estate policy: "NEVER sweep SPDX headers in bulk. Every prior
# LLM sweep has scrambled identifiers, mis-licensed third-party code, or
# reverted owner decisions." REUSE.toml is the sanctioned alternative: it
# declares licensing for paths WITHOUT modifying the files themselves, so no
# existing header is touched and nothing can be silently relicensed.
#
# Licensing follows the estate's two-way split for a sole-owner repository:
#   code, config, CI, manifests -> MPL-2.0
#   prose and documentation     -> CC-BY-SA-4.0
#
# Owner decision (2026-08-29): this repository uses MPL-2.0 for code and
# configuration and CC-BY-SA-4.0 for prose. The unused AGPL-3.0-or-later
# licence text was a migration remnant and has been removed.

# --- Build manifests and package definitions (code) ------------------------
# Globbed rather than listed by name: PR #20 added a fifth manifest
# (proven-spec-suite.ipkg) the same day this file was written, and an
# enumeration silently stops covering new ones. `reuse lint` went 108/108 ->
# 124/125 as a result. A glob cannot drift that way.
[[annotations]]
path = "**/*.ipkg"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- Repository configuration (code) ---------------------------------------
[[annotations]]
path = [
  ".editorconfig",
  ".gitignore",
  ".gitattributes",
  ".tool-versions",
  ".pre-commit-config.yaml",
  ".gitlab-ci.yml",
  "guix.scm",
  "Justfile",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- GitHub/CI configuration (code) ----------------------------------------
[[annotations]]
path = [
  ".github/**",
  "scripts/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- Machine-readable metadata (code: consumed by tools, not prose) --------
[[annotations]]
path = [
  ".machine_readable/**",
  "0-AI-MANIFEST.a2ml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- Container and devcontainer scaffolding --------------------------------
# NOTE: container/ is self-declared uninstantiated template boilerplate (see
# container/README.adoc). It is licensed here so the repository can be REUSE
# compliant; that is NOT an assertion that it works or is wired into CI.
[[annotations]]
path = [
  "container/**",
  ".devcontainer/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

# --- Documentation and prose (share-alike) ---------------------------------
[[annotations]]
path = [
  "AGENTS.adoc",
  "ARCHITECTURE.adoc",
  "CHANGELOG.adoc",
  "CODE_OF_CONDUCT.adoc",
  "CONTRIBUTING.adoc",
  "DEBT.adoc",
  "GOVERNANCE.adoc",
  "ROADMAP.adoc",
  "SECURITY.adoc",
  "SECURITY.md",
  "SUPPORT.adoc",
  "TEST-NEEDS.adoc",
  ".well-known/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- Sample git hook --------------------------------------------------------
[[annotations]]
# Machine artefact: the hypatia baseline is JSON and cannot carry comments.
# The generated READINESS.md carries its own CC-BY-SA-4.0 SPDX header, so it
# must not be aggregated into this MPL-2.0 annotation.
path = ".hypatia-baseline.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
# .mailmap is a git identity-normalisation table; git honours # comments but an
# SPDX header inside it would be read as a (bogus) mapping by some tooling, so
# it is declared here instead of in-file.
path = ".mailmap"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "scripts/git-hooks/pre-push.sample"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"
