# --- Sample git hook --------------------------------------------------------
[[annotations]]
# Machine artefact: the hypatia baseline is JSON and cannot carry comments.
# The generated READINESS.md carries its own CC-BY-SA-4.0 SPDX header, so it
# must not be aggregated into this MPL-2.0 annotation.
path = ".hypatia-baseline.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
# .mailmap is a git identity-normalisation table; git honours # comments but an
# SPDX header inside it would be read as a (bogus) mapping by some tooling, so
# it is declared here instead of in-file.
path = ".mailmap"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jonathan D.A. Jewell (hyperpolymath) <jonathan.jewell@open.ac.uk>"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = "scripts/git-hooks/pre-push.sample"
