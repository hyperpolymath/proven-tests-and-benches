#
# DORMANT — this pipeline has no GitLab project to run on.
#
# The header used to read "Primary CI/CD - GitLab is the source of truth", and
# .github/workflows/ci.yml disabled itself on that basis, calling the `idris2`
# job below "the real gate". As of 2026-08-03 `git remote -v` lists exactly one
# remote — github.com/hyperpolymath/proven-tests-and-benches — so no GitLab
# mirror exists and nothing here has ever executed. Between the two files, the
# repository had no automated build gate at all.
#
# The GitHub workflow is now the real gate. This file is kept because the
# `idris2` job is correct and would work if a GitLab mirror were configured,
# but it must not be cited as evidence that anything is being checked.
#
# Also note, if this is ever activated: every Rust and Elixir job below is
# gated on `exists: [Cargo.toml]` / `[mix.exs]`, neither of which is present,
# and semgrep/cargo-deny/mix-audit/clippy/credo all carry
# `allow_failure: true`. Only trivy, trufflehog and idris2 would actually gate.

stages:
  - security
  - lint
  - test
  - build
variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/
    - target/
# ==================
# Security Scanning
# ==================
trivy:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --format table .
    - trivy fs --exit-code 1 --severity CRITICAL .
  allow_failure: false
semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
    - semgrep --config auto --error .
  allow_failure: true
cargo-audit:
  stage: security
  image: rust:latest
  script:
    - cargo install cargo-audit
    - cargo audit
  rules:
    - exists:
        - Cargo.toml
cargo-deny:
  stage: security
  image: rust:latest
  script:
    - cargo install cargo-deny
    - cargo deny check
  rules:
    - exists:
        - Cargo.toml
  allow_failure: true
mix-audit:
  stage: security
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix archive.install hex mix_audit --force
    - mix deps.get
    - mix deps.audit
  rules:
    - exists:
        - mix.exs
  allow_failure: true
# ==================
# Linting
# ==================
rustfmt:
  stage: lint
  image: rust:latest
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check
  rules:
    - exists:
        - Cargo.toml
clippy:
  stage: lint
  image: rust:latest
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings
  rules:
    - exists:
        - Cargo.toml
  allow_failure: true
mix-format:
  stage: lint
  image: elixir:latest
  script:
    - mix format --check-formatted
  rules:
    - exists:
        - mix.exs
credo:
  stage: lint
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix deps.get
    - mix credo --strict
  rules:
    - exists:
        - mix.exs
  allow_failure: true
# ==================
# Testing
# ==================
cargo-test:
  stage: test
  image: rust:latest
  script:
    - cargo test --all-features
  rules:
    - exists:
        - Cargo.toml
mix-test:
  stage: test
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix deps.get
    - mix test
  rules:
    - exists:
        - mix.exs
# ==================
# Build
# ==================
cargo-build:
  stage: build
  image: rust:latest
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/
    expire_in: 1 week
  rules:
    - exists:
        - Cargo.toml
mix-build:
  stage: build
  image: elixir:latest
  script:
    - mix local.hex --force
    - mix deps.get
    - MIX_ENV=prod mix compile
  rules:
    - exists:
        - mix.exs
trufflehog:
  stage: security
  image: trufflesecurity/trufflehog:latest
  script:
    - trufflehog git file://. --only-verified --fail
# ==================
# Idris2 (this repository's actual language)
# ==================
# Bootstraps Idris2 from source, then compiles + runs the framework and the
# benchmark. The toolchain is cached under the project dir via a HOME override.
idris2:
  stage: build
  image: debian:bookworm
  variables:
    HOME: ${CI_PROJECT_DIR}/.idris2-home
  cache:
    key: idris2-toolchain-v0.7.0
    paths:
      - .idris2-home/
  script:
    - bash scripts/install-idris2.sh
    - bash scripts/ci-build.sh
  rules:
    - exists:
        - proven-tests.ipkg
